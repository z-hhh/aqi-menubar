name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: pnpm install --frozen-lockfile
      # tauri.release.conf.json turns on the signed updater artifacts. Keeping it
      # out of tauri.conf.json means a plain `pnpm tauri build` still works for
      # contributors who do not have the signing key.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "AQI Menubar ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json

  cask:
    # Keep the Homebrew tap pointing at this release.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check the tap token is configured
        id: token
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "TAP_GITHUB_TOKEN is not set; skipping the cask bump." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.skip == 'false'
      - uses: actions/checkout@v4
        if: steps.token.outputs.skip == 'false'
        with:
          repository: z-hhh/homebrew-aqi-menubar
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: tap
      - name: Bump the cask
        if: steps.token.outputs.skip == 'false'
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          url="https://github.com/z-hhh/aqi-menubar/releases/download/v${version}/AQI%20Menubar_${version}_universal.dmg"
          curl -fsSL "$url" -o aqi.dmg
          sha=$(sha256sum aqi.dmg | cut -d' ' -f1)
          ./packaging/homebrew/bump.sh "$version" "$sha" tap
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/aqi-menubar.rb
          git commit -m "aqi-menubar ${version}" || echo "cask already current"
          git push
