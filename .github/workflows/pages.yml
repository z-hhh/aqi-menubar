name: pages

on:
  push:
    branches: [main]
    paths: ["landing/**", "docs/screenshots/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The README screenshots are the single source of truth for the app UI;
      # the landing page shows the same files under shots/.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -R landing/. _site/
          mkdir -p _site/shots
          cp docs/screenshots/*.png _site/shots/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
