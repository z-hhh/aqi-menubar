[package]
name = "aqi-menubar"
version = "0.3.1"
description = "Air Quality Index in your menu bar or system tray, powered by aqicn.org"
edition = "2021"
license = "MIT"
repository = "https://github.com/z-hhh/aqi-menubar"

[lib]
name = "aqi_menubar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time", "sync", "macros", "rt"] }
anyhow = "1"
thiserror = "2"
urlencoding = "2"
sys-locale = "0.3"

# Colouring the macOS status item text needs the raw AppKit objects; Tauri
# only exposes the plain-string title. Versions track the ones Tauri already
# links (tauri 2.12 -> tray-icon 0.25 -> objc2 0.6 / objc2-app-kit 0.3), so no
# second copy of AppKit bindings is compiled in.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
  "NSButton",
  "NSControl",
  "NSColor",
  "NSFont",
  "NSScreen",
  "NSStatusItem",
  "NSStatusBarButton",
  "NSView",
  "NSWindow",
  "NSAttributedString",
  "NSAppearance",
  "objc2-core-foundation",
] }
objc2-foundation = { version = "0.3", features = [
  "NSString",
  "NSArray",
  "NSRange",
  "NSGeometry",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
